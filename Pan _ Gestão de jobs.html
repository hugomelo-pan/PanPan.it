<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Pan | Gestão de jobs</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('pan-theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eff6;--accent:#01a09d;--accent-2:#0b8e8b;--card:#ffffff;
  --glass:rgba(255,255,255,.62);--line:rgba(20,45,80,.12);--line-2:rgba(20,45,80,.22);
  --text:#14243a;--muted:#4f647c;--dim:#75879e;--t2:#33475f;--acc-t:#047a78;--danger-t:#c2333f;
  --green:#0f9f6e;--yellow:#d99a06;--red:#dc4a4a;--orange:#e2751d;
  --f1:rgba(20,45,80,.035);--f2:rgba(20,45,80,.055);--f3:rgba(20,45,80,.08);--f4:rgba(20,45,80,.12);
  --hl:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);--input:rgba(255,255,255,.8);--dk1:rgba(20,45,80,.05);
  --tile:rgba(255,255,255,.72);--tile-h:rgba(255,255,255,.94);--pop:rgba(255,255,255,.95);--modal:rgba(247,250,254,.9);
  --scrim:rgba(20,35,55,.42);--ring:rgba(255,255,255,.95);--shadow-l:0 1.4rem 2.8rem -1.4rem rgba(20,45,80,.32);
  --tagpct:58%;--tagbase:#0b1626;--blob:.3;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#162132;--accent:#01a09d;--accent-2:#19c7c3;--card:#192a3e;--glass:rgba(25,42,62,.5);--line:var(--f3);--line-2:rgba(255,255,255,.18);--text:#e9f0f7;--muted:#93a7bf;--dim:#6d839e;--t2:var(--t2);--acc-t:var(--acc-t);--danger-t:var(--danger-t);--green:#34d399;--yellow:#fbbf24;--red:#f87171;--orange:#fb923c;--f1:var(--f1);--f2:var(--f2);--f3:var(--f3);--f4:var(--f4);--hl:var(--f3);--sheen:var(--f2);--input:var(--input);--dk1:var(--dk1);--tile:var(--tile);--tile-h:var(--tile-h);--pop:rgba(21,35,53,.93);--modal:rgba(24,40,60,.84);--scrim:var(--scrim);--ring:var(--ring);--shadow-l:var(--shadow-l);--tagpct:100%;--tagbase:#fff;--blob:.5;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#162132;--accent:#01a09d;--accent-2:#19c7c3;--card:#192a3e;--glass:rgba(25,42,62,.5);--line:var(--f3);--line-2:rgba(255,255,255,.18);--text:#e9f0f7;--muted:#93a7bf;--dim:#6d839e;--t2:var(--t2);--acc-t:var(--acc-t);--danger-t:var(--danger-t);--green:#34d399;--yellow:#fbbf24;--red:#f87171;--orange:#fb923c;--f1:var(--f1);--f2:var(--f2);--f3:var(--f3);--f4:var(--f4);--hl:var(--f3);--sheen:var(--f2);--input:var(--input);--dk1:var(--dk1);--tile:var(--tile);--tile-h:var(--tile-h);--pop:rgba(21,35,53,.93);--modal:rgba(24,40,60,.84);--scrim:var(--scrim);--ring:var(--ring);--shadow-l:var(--shadow-l);--tagpct:100%;--tagbase:#fff;--blob:.5;color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;font-size:13px;scroll-padding-top:env(safe-area-inset-top,0px)}
@media (min-width:2400px){html{font-size:14px}}
@media (min-width:3200px){html{font-size:17px}}
@media (max-width:1280px){html{font-size:12.5px}}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'Manrope',Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:1rem;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed;opacity:.4}
a{color:var(--accent-2);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
svg{display:block}
.muted{color:var(--muted)}
.grow{flex:1;min-width:0}

/* Fundo */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--blob);animation:drift 42s ease-in-out infinite alternate}
.b1{width:36rem;height:36rem;left:-10rem;top:-7rem;background:radial-gradient(circle,#01a09d 0%,rgba(1,160,157,0) 70%)}
.b2{width:44rem;height:44rem;right:-12rem;top:18%;background:radial-gradient(circle,#2563eb 0%,rgba(37,99,235,0) 70%);animation-delay:-14s}
.b3{width:34rem;height:34rem;left:30%;bottom:-12rem;background:radial-gradient(circle,#0ea5a3 0%,rgba(14,165,163,0) 70%);animation-delay:-22s}
.b4{width:26rem;height:26rem;left:55%;top:-6rem;background:radial-gradient(circle,#38bdf8 0%,rgba(56,189,248,0) 70%);opacity:.32;animation-delay:-8s}
@keyframes drift{to{transform:translate(5rem,3.5rem) scale(1.12)}}

/* Vidro */
.glass{position:relative;background:var(--glass);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--line);border-radius:1.25rem;box-shadow:var(--shadow-l),inset 0 1px 0 var(--hl)}
.glass::before{content:"";position:absolute;left:0;right:0;top:0;height:3.5rem;border-radius:inherit;border-bottom-left-radius:0;border-bottom-right-radius:0;background:linear-gradient(180deg,var(--sheen),transparent);pointer-events:none}
.tile{position:relative;background:linear-gradient(180deg,var(--f1),rgba(255,255,255,.01) 60%),var(--tile);border:1px solid var(--line);border-radius:.8rem;box-shadow:inset 0 1px 0 var(--hl),0 .6rem 1.4rem -1rem rgba(0,0,0,.7);transition:border-color .2s,background-color .2s}
.tile:hover{border-color:var(--line-2);background-color:var(--tile-h)}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;height:2.3rem;padding:0 .9rem;border-radius:.7rem;border:1px solid rgba(255,255,255,.16);background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0) 60%),var(--accent);color:#fff;font-weight:700;font-size:.92rem;white-space:nowrap;box-shadow:0 .5rem 1.2rem -.6rem rgba(1,160,157,.9),inset 0 1px 0 rgba(255,255,255,.28);transition:filter .15s,transform .15s}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.ghost{background:var(--f2);color:var(--text);border-color:var(--line);box-shadow:inset 0 1px 0 var(--hl)}
.btn.ghost:hover:not(:disabled){background:var(--f4);filter:none}
.btn.danger{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 60%),#c2414b;box-shadow:0 .5rem 1.2rem -.6rem rgba(194,65,75,.9)}
.btn.sm{height:1.95rem;padding:0 .7rem;font-size:.85rem;border-radius:.6rem}
.btn svg{width:1rem;height:1rem}
.icon-btn{width:2.2rem;height:2.2rem;display:inline-grid;place-items:center;flex:none;border-radius:.65rem;border:1px solid var(--line);background:var(--f1);color:var(--text);transition:background .15s,border-color .15s}
.icon-btn:hover:not(:disabled){background:var(--f4);border-color:var(--line-2)}
.icon-btn svg{width:1.05rem;height:1.05rem}
.icon-btn.xs{width:1.65rem;height:1.65rem;border-radius:.5rem}
.icon-btn.xs svg{width:.85rem;height:.85rem}
.icon-btn.play{background:var(--accent);border-color:rgba(255,255,255,.18);color:#fff;box-shadow:0 .4rem 1rem -.5rem rgba(1,160,157,.9)}
.icon-btn.pause{background:var(--yellow);border-color:rgba(255,255,255,.25);color:#1b2433}
.icon-btn.play:hover:not(:disabled),.icon-btn.pause:hover:not(:disabled){filter:brightness(1.1)}

/* Campos */
input[type=text],input[type=password],input[type=email],input[type=tel],input[type=url],input[type=number],textarea{width:100%;background:var(--input);border:1px solid var(--line);border-radius:.65rem;color:var(--text);padding:.55rem .75rem;font:inherit;font-size:.92rem;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(1,160,157,.22)}
input:disabled,textarea:disabled{opacity:.6;cursor:not-allowed}
textarea{resize:vertical;min-height:5rem;line-height:1.5}
.field{display:flex;flex-direction:column;gap:.35rem;margin:0 0 .8rem;border:0;padding:0;min-width:0}
.field>span,.field>legend{font-size:.82rem;font-weight:600;color:var(--muted);padding:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.inline-form{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.inline-form input{flex:1;min-width:9rem}

/* Seletor próprio (substitui select nativo) */
.pk{display:inline-flex;align-items:center;gap:.45rem;height:2.3rem;padding:0 .65rem;border-radius:.65rem;border:1px solid var(--line);background:var(--f1);color:var(--text);font-size:.9rem;font-weight:600;max-width:100%;min-width:0;transition:background .15s,border-color .15s,box-shadow .15s;box-shadow:inset 0 1px 0 var(--hl)}
.pk:hover:not(:disabled){background:var(--f3);border-color:var(--line-2)}
.pk[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px rgba(1,160,157,.2)}
.pk .pk-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk .chev{width:.8rem;height:.8rem;opacity:.65;flex:none;margin-left:auto}
.pk svg:not(.chev){width:1rem;height:1rem;flex:none}
.pk.block{width:100%}
.pk.sm{height:1.95rem;font-size:.84rem;padding:0 .55rem;border-radius:.55rem}
.pk.accent{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0) 60%),var(--accent);border-color:rgba(255,255,255,.16);color:#fff}
.pk.dashed{border-style:dashed;background:transparent;color:var(--muted)}
.pk.dashed:hover:not(:disabled){color:var(--text)}
.sdot{width:.6rem;height:.6rem;border-radius:50%;flex:none;display:inline-block}
.sdot.st-active{background:var(--green);box-shadow:0 0 .5rem rgba(52,211,153,.7)}
.sdot.st-paused{background:var(--yellow)}
.sdot.st-off{background:var(--red)}
.sdot.st-lunch{background:var(--orange)}
.swatch{width:1rem;height:1rem;border-radius:50%;flex:none;display:inline-block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}

.dd{position:fixed;z-index:100;min-width:13rem;max-width:21rem;max-height:22rem;display:flex;flex-direction:column;padding:.35rem;border-radius:.9rem;background:var(--pop);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--line-2);box-shadow:0 1.4rem 2.8rem -1rem rgba(0,0,0,.75),inset 0 1px 0 var(--hl);animation:ddin .14s ease}
@keyframes ddin{from{opacity:0;transform:translateY(-4px)}}
.dd-title{font-size:.78rem;color:var(--dim);font-weight:700;padding:.4rem .6rem .2rem}
.dd-search{padding:.2rem .2rem .35rem}
.dd-search input{padding:.45rem .65rem;font-size:.88rem}
.dd-list{overflow-y:auto;outline:none;min-height:0}
.dd-opt{width:100%;display:flex;align-items:center;gap:.6rem;padding:.45rem .55rem;border-radius:.6rem;text-align:left;font-size:.9rem}
.dd-opt.act,.dd-opt:hover:not(:disabled){background:var(--f3)}
.dd-opt.sel b{color:var(--acc-t)}
.dd-opt>svg{width:1rem;height:1rem;flex:none;color:var(--muted)}
.dd-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.dd-txt b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-txt small{color:var(--muted);font-size:.78rem;line-height:1.3}
.dd-h{font-size:.76rem;color:var(--dim);font-weight:700;padding:.5rem .6rem .2rem}
.dd-div{height:1px;background:var(--line);margin:.3rem .2rem}
.dd-check svg{width:.95rem;height:.95rem;color:var(--accent-2)}
.dd-empty{padding:.7rem;color:var(--dim);font-size:.86rem}
.dd-opt.danger b{color:var(--danger-t)}

/* Avatares */
.av{--s:36px;position:relative;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:inline-grid;place-items:center;background:linear-gradient(135deg,var(--g1),var(--g2));font-weight:800;font-size:calc(var(--s)*.36);color:#fff;letter-spacing:.02em;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 2px var(--ring)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.av .dot{position:absolute;right:-1px;bottom:-1px;width:max(10px,calc(var(--s)*.28));height:max(10px,calc(var(--s)*.28));border-radius:50%;border:2px solid var(--bg);display:grid;place-items:center}
.dot.st-active{background:var(--green);box-shadow:0 0 8px rgba(52,211,153,.7)}
.dot.st-paused{background:var(--yellow)}
.dot.st-off{background:var(--red)}
.dot.st-lunch{background:var(--orange);width:max(15px,calc(var(--s)*.38));height:max(15px,calc(var(--s)*.38))}
.dot svg{width:68%;height:68%;color:#1b2433}
.stack{display:flex;align-items:center;padding-left:5px}
.stack>span{margin-left:-6px;display:inline-flex}

/* Estrutura */
.app{position:relative;z-index:1;display:grid;grid-template-columns:5.4rem minmax(0,1fr);gap:1rem;padding:1rem;min-height:100%}
.sidebar{position:sticky;top:1rem;height:calc(100dvh - 2rem - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:.7rem;padding:.8rem .45rem;border-radius:1.4rem}
.side-col{display:flex;flex-direction:column;align-items:center;gap:.45rem}
.side-me{border-radius:50%;transition:transform .2s}
.side-me:hover{transform:scale(1.06)}
.pk.mini{height:1.7rem;padding:0 .35rem;font-size:.7rem;gap:.28rem;width:4.6rem;justify-content:center;border-radius:.5rem}
.pk.mini .chev{display:none}
.pk.icon-only{width:2.2rem;height:2.2rem;padding:0;justify-content:center;position:relative}
.pk.icon-only .fdot{position:absolute;top:.3rem;right:.3rem;width:.45rem;height:.45rem;border-radius:50%;background:var(--accent-2)}
.side-sep{width:2.4rem;height:1px;background:var(--line);flex:none}
.people{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;gap:.7rem;padding:.35rem .2rem;width:100%;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.side-person{position:relative;border-radius:50%;padding:2px;transition:transform .2s,box-shadow .2s}
.side-person:hover{transform:translateY(-2px)}
.side-person.on{box-shadow:0 0 0 2px var(--accent),0 0 14px rgba(1,160,157,.5)}
.badge{position:absolute;top:-3px;right:-5px;min-width:1.2rem;height:1.2rem;padding:0 .3rem;border-radius:.6rem;background:#e0445a;color:#fff;font-size:.7rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(224,68,90,.18)}}
.side-empty{font-size:.72rem;color:var(--dim);text-align:center}

main{display:flex;flex-direction:column;gap:1rem;min-width:0}
.topbar{display:flex;align-items:center;gap:.8rem;padding:.5rem .6rem .5rem .9rem;border-radius:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.6rem;margin-right:auto}
.brand-mark{width:1.9rem;height:1.9rem;border-radius:.6rem;background:conic-gradient(from 210deg,#01a09d,#2563eb,#19c7c3,#01a09d);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 .4rem 1rem -.4rem rgba(1,160,157,.8)}
.brand b{display:block;font-size:1.05rem;letter-spacing:-.01em;line-height:1.1}
.brand small{color:var(--muted);font-size:.78rem}
.tb-right{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
.tb-label{font-size:.8rem;color:var(--muted);font-weight:600}
.role-pill{font-size:.72rem;font-weight:700;padding:.2rem .6rem;border-radius:1rem;background:var(--f3);border:1px solid var(--line);color:var(--muted)}
.role-pill.admin{background:rgba(1,160,157,.18);border-color:rgba(1,160,157,.45);color:var(--acc-t)}

/* Cabeçalho da pessoa */
.person{display:flex;align-items:center;gap:1.2rem;padding:.9rem 1.1rem;flex-wrap:wrap}
.ph-main{display:flex;gap:.9rem;align-items:center;min-width:0;flex:1 1 26rem}
.ph-info{min-width:0;display:flex;flex-direction:column;gap:.35rem}
.ph-name{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.ph-name h1{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.chip{font-size:.74rem;font-weight:600;padding:.15rem .55rem;border-radius:1rem;background:rgba(1,160,157,.13);border:1px solid rgba(1,160,157,.35);color:var(--acc-t)}
.ph-meta{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;font-size:.84rem}
.contact{display:inline-flex;align-items:center;gap:.3rem;color:var(--muted)}
.contact svg{width:.9rem;height:.9rem}
.contact:hover{color:var(--text)}
.ph-stats{display:grid;grid-template-columns:repeat(4,minmax(5.8rem,1fr));gap:.5rem;flex:0 1 30rem}
.stat{padding:.55rem .75rem;border-radius:.8rem;background:var(--dk1);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hl)}
.stat b{display:block;font-size:1.15rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.stat small{color:var(--muted);font-size:.76rem}
.stat.hl{background:linear-gradient(160deg,rgba(1,160,157,.28),rgba(1,160,157,.06));border-color:rgba(1,160,157,.4)}

/* Pauta */
.pauta{padding:1rem 1.1rem 1.1rem}
.pauta-head{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:.8rem}
.pauta-head h2{font-size:1.12rem;font-weight:800;letter-spacing:-.01em}
.pauta-head p{font-size:.82rem;color:var(--muted)}
.seg{display:inline-flex;padding:2px;border-radius:.7rem;background:var(--dk1);border:1px solid var(--line)}
.seg button{display:inline-flex;align-items:center;gap:.35rem;height:1.9rem;padding:0 .7rem;border-radius:.55rem;font-size:.84rem;font-weight:700;color:var(--muted);transition:background .2s,color .2s}
.seg button svg{width:.95rem;height:.95rem}
.seg button.on{background:var(--f4);color:var(--text);box-shadow:inset 0 1px 0 var(--hl)}
.alerts{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.8rem}
.alert{display:flex;align-items:center;gap:.7rem;padding:.55rem .75rem;border-radius:.85rem;background:linear-gradient(100deg,rgba(224,68,90,.26),rgba(251,146,60,.12));border:1px solid rgba(248,113,113,.45)}
.alert-ic{width:1.6rem;height:1.6rem;border-radius:50%;flex:none;display:grid;place-items:center;background:#e0445a;color:#fff;font-weight:800;font-size:.85rem}
.alert div{flex:1;min-width:0;display:flex;flex-direction:column}
.alert b{font-size:.86rem}
.alert span{font-size:.82rem;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.jlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.4rem}
.jr{display:flex;align-items:center;gap:.7rem;padding:.5rem .6rem .5rem .5rem;cursor:pointer}
.jr.appr{border-color:rgba(248,113,113,.55)}
.jr.delivered{opacity:.62}
.q-num{flex:none;width:1.7rem;height:1.7rem;border-radius:.5rem;display:grid;place-items:center;font-weight:800;font-size:.84rem;background:rgba(1,160,157,.16);color:var(--acc-t);border:1px solid rgba(1,160,157,.35);font-variant-numeric:tabular-nums}
.q-num svg{width:.85rem;height:.85rem}
.grip{color:var(--dim);cursor:grab;flex:none}
.grip svg{width:.85rem;height:.85rem}
.jr-main{flex:1;min-width:0;display:flex;align-items:center;gap:.6rem}
.jr-id{display:flex;flex-direction:column;min-width:0;flex:1}
.jr-top{display:flex;align-items:center;gap:.4rem;min-width:0}
.code{font-size:.78rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.jr-title{font-weight:700;font-size:.95rem;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jr-sub{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:.1rem}
.client{font-weight:600;color:var(--t2);margin-right:.2rem}
.parent-l{font-size:.78rem;display:inline-flex;align-items:center;gap:.2rem;color:var(--dim);font-weight:600}
.parent-l svg{width:.8rem;height:.8rem}
.stage{font-size:.72rem;font-weight:700;padding:.1rem .45rem;border-radius:.4rem;background:var(--f2);border:1px solid var(--line);color:var(--t2);white-space:nowrap;flex:none}
.tag{--c:#4dabf7;display:inline-flex;align-items:center;gap:.25rem;font-size:.72rem;font-weight:700;padding:.1rem .5rem;border-radius:1rem;color:color-mix(in srgb,var(--c) var(--tagpct),var(--tagbase));background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);white-space:nowrap}
.tag-x{display:grid;place-items:center;width:.95rem;height:.95rem;border-radius:50%;margin-right:-.2rem;color:inherit;opacity:.7}
.tag-x:hover{opacity:1;background:color-mix(in srgb,var(--c) 30%,transparent)}
.tag-x svg{width:.6rem;height:.6rem}
.flag{display:inline-flex;align-items:center;gap:.2rem;font-size:.7rem;font-weight:800;padding:.1rem .45rem;border-radius:.4rem;white-space:nowrap;flex:none}
.flag svg{width:.75rem;height:.75rem}
.flag-appr{background:#e0445a;color:#fff}
.flag-wait{background:rgba(251,146,60,.16);color:var(--orange);border:1px solid rgba(251,146,60,.4)}
.flag-ok{background:rgba(52,211,153,.14);color:var(--green);border:1px solid rgba(52,211,153,.4)}
.flag-back{background:rgba(251,191,36,.14);color:var(--yellow);border:1px solid rgba(251,191,36,.4)}
.flag-done{background:var(--f3);color:var(--muted);border:1px solid var(--line)}
.jr-side{display:flex;align-items:center;gap:.8rem;flex:none}
.jr-time{display:flex;align-items:center;gap:.5rem}
.jr-time>div{display:flex;flex-direction:column;align-items:flex-end;min-width:4.4rem}
.jr-time .icon-btn{width:1.9rem;height:1.9rem}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:.92rem}
.timer.live{color:var(--green)}
.jr-time small{font-size:.72rem;color:var(--dim);font-variant-numeric:tabular-nums}
.jr-order{display:flex;flex-direction:column;gap:2px;flex:none}
.dragging{opacity:.4}
.drop-before{box-shadow:0 -3px 0 0 var(--accent-2)!important}
.drop-after{box-shadow:0 3px 0 0 var(--accent-2)!important}
.empty{padding:1.8rem 1rem;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:1rem;font-size:.9rem}
.empty b{display:block;color:var(--text);font-size:1rem;margin-bottom:.2rem}
.deliv{margin-top:.8rem}
.deliv summary{cursor:pointer;font-size:.84rem;font-weight:700;color:var(--muted);padding:.3rem 0;list-style:none;display:flex;align-items:center;gap:.4rem}
.deliv summary::-webkit-details-marker{display:none}
.deliv summary svg{width:.85rem;height:.85rem;transition:transform .2s}
.deliv[open] summary svg{transform:rotate(90deg)}
.deliv .jlist{margin-top:.4rem}

.kanban{display:flex;gap:.7rem;overflow-x:auto;padding-bottom:.4rem;align-items:flex-start}
.kcol{flex:0 0 17rem;display:flex;flex-direction:column;border-radius:1rem;background:var(--dk1);border:1px solid var(--line)}
.kcol-head{display:flex;align-items:center;gap:.4rem;padding:.65rem .65rem .45rem .8rem}
.kcol-head h3{font-size:.88rem;font-weight:800;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-size:.72rem;font-weight:800;min-width:1.4rem;height:1.25rem;border-radius:.65rem;display:grid;place-items:center;background:var(--f3);color:var(--muted)}
.kcol-tools{display:flex;gap:3px}
.kcol-body{display:flex;flex-direction:column;gap:.45rem;padding:.2rem .55rem .7rem;min-height:5rem;border-radius:0 0 1rem 1rem;transition:background .2s}
.kcol-body.drop-on{background:rgba(1,160,157,.12)}
.k-empty{font-size:.8rem;color:var(--dim);text-align:center;padding:1.2rem .4rem;border:1px dashed var(--line);border-radius:.7rem}
.kc{padding:.6rem;cursor:pointer;display:flex;flex-direction:column;gap:.35rem}
.kc.appr{border-color:rgba(248,113,113,.55)}
.kc.delivered{opacity:.6}
.kc .q-num{width:1.4rem;height:1.4rem;border-radius:.4rem;font-size:.74rem}
.kc .jr-title{white-space:normal;font-size:.88rem}
.kc-foot{display:flex;align-items:center;justify-content:space-between;gap:.4rem}
.kc-foot .jr-time>div{min-width:0}
.kcol-add{flex:0 0 11rem;height:2.8rem;border-radius:.9rem;border:1px dashed var(--line-2);color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:center;gap:.35rem;font-size:.86rem}
.kcol-add svg{width:.95rem;height:.95rem}
.kcol-add:hover{background:var(--f1);color:var(--text)}

/* Card do job (modal central) */
.jm-wrap{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:1.2rem;pointer-events:none}
.jm-overlay{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .22s}
.jm{position:relative;width:min(70rem,100%);height:min(88dvh,62rem);display:flex;flex-direction:column;background:var(--modal);border-radius:1.5rem;opacity:0;transform:translateY(12px) scale(.985);transition:opacity .22s,transform .26s cubic-bezier(.2,.8,.2,1)}
.jm-wrap.open{pointer-events:auto}
.jm-wrap.open .jm-overlay{opacity:1}
.jm-wrap.open .jm{opacity:1;transform:none}
.jm-head{padding:.9rem 1.3rem 0;position:relative;z-index:2;border-bottom:1px solid var(--line)}
.jm-bar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.crumb{display:inline-flex;align-items:center;gap:.3rem;font-size:.8rem;font-weight:700;color:var(--accent-2);padding:.2rem .5rem .2rem .3rem;border-radius:.5rem;background:rgba(1,160,157,.1);max-width:22rem}
.crumb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb svg{width:.85rem;height:.85rem;flex:none}
.crumb:hover{background:rgba(1,160,157,.2)}
.jm-client{display:inline-flex;align-items:center;gap:.3rem;font-size:.8rem;font-weight:600;color:var(--muted)}
.jm-client svg{width:.75rem;height:.75rem;opacity:.7}
.jm-total{display:inline-flex;align-items:center;gap:.35rem;font-size:.82rem;color:var(--muted);padding:0 .3rem}
.jm-total svg{width:.95rem;height:.95rem}
.jm-total b{color:var(--text)}
.jm-titlerow{display:flex;align-items:center;gap:.7rem;margin-top:.45rem}
.jm-code{font-weight:800;font-size:1.25rem;color:var(--acc-t);font-variant-numeric:tabular-nums;flex:none}
.jm-divider{width:1px;height:1.4rem;background:var(--line-2);flex:none}
.jm-title{flex:1;font-size:1.35rem!important;font-weight:800!important;letter-spacing:-.01em;padding:.25rem .45rem!important;margin-left:-.45rem;background:transparent!important;border-color:transparent!important}
.jm-title:hover:not(:disabled){border-color:var(--line)!important}
.jm-title:focus{border-color:var(--accent)!important}
.jm-title:disabled{opacity:1;cursor:default}
.jm-tags{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin-top:.45rem}
.jm-tags .tag{font-size:.78rem;padding:.2rem .55rem}
.jm-flags{display:flex;gap:.35rem;flex-wrap:wrap}
.banner{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;padding:.6rem .8rem;border-radius:.8rem;margin-top:.6rem}
.banner>div:first-child{flex:1;min-width:14rem}
.banner b{font-size:.86rem}
.banner p{font-size:.82rem;margin-top:.1rem}
.banner.appr{background:linear-gradient(100deg,rgba(224,68,90,.28),rgba(251,146,60,.12));border:1px solid rgba(248,113,113,.5)}
.banner.back{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.4)}
.banner-btns{display:flex;gap:.4rem}
.tabs{display:flex;gap:.2rem;margin-top:.8rem;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:inline-flex;align-items:center;gap:.4rem;padding:.6rem .85rem .7rem;font-size:.9rem;font-weight:700;color:var(--muted);white-space:nowrap;border-radius:.6rem .6rem 0 0;transition:color .15s,background .15s}
.tab svg{width:1rem;height:1rem}
.tab:hover{color:var(--text);background:var(--f1)}
.tab.on{color:var(--text)}
.tab.on::after{content:"";position:absolute;left:.6rem;right:.6rem;bottom:-1px;height:2px;border-radius:2px;background:var(--accent-2);box-shadow:0 0 10px rgba(25,199,195,.7)}
.tab .count{height:1.15rem;font-size:.7rem}
.tab.on .count{background:rgba(1,160,157,.25);color:var(--acc-t)}
.jm-body{flex:1;overflow-y:auto;padding:1.1rem 1.3rem 1.4rem;min-height:0}
.jm-body.tab-feed{display:flex;flex-direction:column;overflow:hidden;padding:0}
.blk+.blk{margin-top:1.3rem}
.blk-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.55rem}
.blk-head h4{font-size:.95rem;font-weight:800}
.blk-head .muted{font-size:.8rem}
.blk-note{font-size:.82rem;color:var(--muted);margin:-.2rem 0 .7rem}
.progress{height:5px;border-radius:4px;background:var(--f3);overflow:hidden;width:7rem}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:4px}

.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.45rem;margin-bottom:.6rem}
.link-card{display:flex;align-items:center;gap:.6rem;padding:.5rem .6rem;min-width:0}
.link-ic{width:1.9rem;height:1.9rem;border-radius:.55rem;display:grid;place-items:center;background:var(--f2);flex:none}
.link-ic svg{width:1.05rem;height:1.05rem}
.link-card>div{flex:1;min-width:0;display:flex;flex-direction:column}
.link-card a{font-weight:700;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-card small{color:var(--dim);font-size:.74rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.rte{border:1px solid var(--line);border-radius:.8rem;background:var(--dk1);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.rte:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(1,160,157,.18)}
.rte-bar{display:flex;align-items:center;gap:2px;padding:.3rem .35rem;border-bottom:1px solid var(--line);background:var(--f1);flex-wrap:wrap}
.rt{min-width:1.85rem;height:1.85rem;padding:0 .3rem;border-radius:.45rem;display:inline-grid;place-items:center;color:var(--t2);font-size:.9rem;font-weight:700}
.rt:hover{background:var(--f3);color:var(--text)}
.rt svg{width:.95rem;height:.95rem}
.rt-sep{width:1px;height:1.1rem;background:var(--line);margin:0 .25rem}
.rte-area{padding:.75rem .9rem;outline:none;line-height:1.6;font-size:.94rem;overflow-wrap:anywhere}
.rte-area.desc{min-height:14rem}
.rte-area:empty::before{content:attr(data-ph);color:var(--dim);pointer-events:none}
.rte-area[contenteditable="false"]{cursor:default}
.rich p,.rte-area p,.rich div,.rte-area div{margin:0 0 .5rem}
.rich>*:last-child,.rte-area>*:last-child{margin-bottom:0}
.rich h3,.rte-area h3{font-size:1.08rem;font-weight:800;margin:.7rem 0 .35rem}
.rich ul,.rich ol,.rte-area ul,.rte-area ol{margin:.2rem 0 .6rem;padding-left:1.3rem}
.rich blockquote,.rte-area blockquote{margin:.4rem 0 .6rem;padding:.3rem .8rem;border-left:3px solid var(--accent);color:var(--t2);background:rgba(1,160,157,.07);border-radius:0 .4rem .4rem 0}
.mention{display:inline-block;padding:0 .3rem;border-radius:.35rem;background:rgba(1,160,157,.2);color:var(--acc-t);font-weight:700}

.sj-list{list-style:none;margin:0 0 .8rem;padding:0;display:flex;flex-direction:column;gap:.4rem}
.sj{display:flex;align-items:center;gap:.7rem;padding:.55rem .7rem;cursor:pointer}
.sj .jr-title{flex:1;min-width:0}
.sj>svg{width:.9rem;height:.9rem;color:var(--dim);flex:none}
.sj-form{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;padding:.6rem;border:1px dashed var(--line-2);border-radius:.8rem}
.sj-form input{flex:1;min-width:12rem}

.pc-row{display:flex;gap:.6rem;overflow-x:auto;padding:.15rem .1rem .6rem;scroll-snap-type:x proximity}
.pc{flex:0 0 13.2rem;display:flex;flex-direction:column;gap:.55rem;padding:.8rem;scroll-snap-align:start}
.pc.running{border-color:rgba(52,211,153,.5);box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px rgba(52,211,153,.15)}
.pc.current{box-shadow:inset 0 1px 0 var(--hl),0 0 0 2px rgba(1,160,157,.4)}
.pc-top{display:flex;align-items:center;gap:.55rem;min-width:0;padding-right:1.4rem}
.pc-top>div{min-width:0;display:flex;flex-direction:column}
.pc-top b{font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-top small{font-size:.74rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-state{font-size:.76rem;font-weight:700;color:var(--muted)}
.pc-state.ok{color:var(--green)}
.pc-state.run{color:var(--green)}
.pc .timer{font-size:1.35rem;letter-spacing:-.01em}
.pc-btns{display:flex;gap:.4rem;align-items:center}
.pc-btns .pk{flex:1}
.pc-x{position:absolute;top:.55rem;right:.55rem}
.pc-add>svg{width:1.6rem;height:1.6rem;opacity:.7}
.pc-add{flex:0 0 13.2rem;border:1px dashed var(--line-2);border-radius:.8rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;padding:.8rem;color:var(--muted);font-size:.82rem;text-align:center}

.flow{list-style:none;margin:0;padding:.15rem .1rem .5rem;display:flex;gap:1.3rem;overflow-x:auto}
.fstep{position:relative;flex:none;display:flex;align-items:center;gap:.5rem;padding:.45rem .7rem .45rem .45rem;border-radius:.8rem;border:1px solid var(--line);background:var(--dk1)}
.fstep:not(:last-child)::after{content:"";position:absolute;right:-1.15rem;top:50%;width:.9rem;height:2px;background:var(--line-2)}
.fstep:not(:last-child)::before{content:"";position:absolute;right:-1.2rem;top:calc(50% - 3px);width:6px;height:6px;border-top:2px solid var(--line-2);border-right:2px solid var(--line-2);transform:rotate(45deg)}
.fstep b{font-size:.84rem;display:block;white-space:nowrap}
.fstep small{font-size:.72rem;color:var(--muted);white-space:nowrap}
.fstep.done{opacity:.72}
.fstep.done small{color:var(--green)}
.fstep.current{border-color:var(--accent);background:rgba(1,160,157,.16);box-shadow:0 0 0 3px rgba(1,160,157,.14)}
.fstep.current small{color:var(--acc-t);font-weight:700}
.fnum{width:1.15rem;height:1.15rem;border-radius:50%;font-size:.66rem;font-weight:800;display:grid;place-items:center;background:var(--f3);flex:none}
.fstep.done .fnum{background:var(--green);color:#10321f}
.fstep.current .fnum{background:var(--accent);color:#fff}
.fs-tools{display:flex;gap:2px;margin-left:.2rem}
.flow-tools{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.5rem;align-items:center}
.flow-done{font-size:.8rem;color:var(--green);font-weight:700}

.feed{flex:1;overflow-y:auto;padding:1rem 1.3rem;display:flex;flex-direction:column;gap:.55rem;min-height:0}
.fe-day{align-self:center;font-size:.72rem;font-weight:700;color:var(--dim);padding:.15rem .6rem;border-radius:1rem;background:var(--f1);margin:.4rem 0 .1rem}
.fe-ev{display:flex;align-items:center;gap:.45rem;font-size:.8rem;color:var(--muted);padding:0 .2rem}
.fe-ev b{color:var(--t2);font-weight:700}
.fe-ev time,.fe-c time{font-size:.7rem;color:var(--dim);margin-left:auto;flex:none;padding-left:.6rem}
.fe-ev .txt{min-width:0}
.fe-c{display:flex;gap:.55rem;align-items:flex-start;margin:.2rem 0}
.bubble{flex:1;min-width:0;max-width:44rem;padding:.55rem .75rem;border-radius:.2rem .9rem .9rem .9rem;background:var(--f2);border:1px solid var(--line)}
.fe-c.mine .bubble{background:rgba(1,160,157,.13);border-color:rgba(1,160,157,.32)}
.fe-c.ment .bubble{box-shadow:0 0 0 2px rgba(251,146,60,.45)}
.bh{display:flex;align-items:center;gap:.4rem;margin-bottom:.15rem}
.bh b{font-size:.84rem}
.bb{font-size:.9rem;line-height:1.55}
.composer{flex:none;padding:.7rem 1.3rem 1rem;border-top:1px solid var(--line);background:var(--dk1)}
.composer .rte-area{max-height:9rem;min-height:2.8rem;overflow-y:auto}
.composer-foot{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-top:.5rem}
.composer-foot small{font-size:.76rem}

/* Diálogos */
.dlg-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:1rem;background:var(--scrim);animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.dlg{width:min(33rem,100%);max-height:calc(100dvh - 2rem);display:flex;flex-direction:column;background:var(--modal);animation:pop .22s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.dlg header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.1rem .6rem;position:relative;z-index:1}
.dlg header h3{font-size:1.05rem;font-weight:800}
.dlg-body{padding:.3rem 1.1rem .5rem;overflow-y:auto}
.dlg-body>p{font-size:.88rem;margin-bottom:.8rem}
.dlg footer{display:flex;justify-content:flex-end;gap:.5rem;padding:.7rem 1.1rem 1rem}
.mgr{list-style:none;margin:0 0 .8rem;padding:0;display:flex;flex-direction:column;gap:.4rem}
.mgr li{display:flex;align-items:center;gap:.45rem}
.mgr small{color:var(--dim);font-size:.72rem;white-space:nowrap}
.team-pick{display:flex;flex-wrap:wrap;gap:.35rem}
.chk-chip{position:relative;cursor:pointer}
.chk-chip input{position:absolute;opacity:0;pointer-events:none}
.chk-chip span{display:inline-block;padding:.35rem .7rem;border-radius:1rem;font-size:.8rem;font-weight:600;border:1px solid var(--line);background:var(--f1);color:var(--muted);transition:all .15s}
.chk-chip input:checked+span{background:rgba(1,160,157,.2);border-color:rgba(1,160,157,.55);color:var(--acc-t)}
.chk-chip input:focus-visible+span{outline:2px solid var(--accent-2);outline-offset:2px}
.pf-top{display:flex;align-items:center;gap:1rem;margin-bottom:.9rem}
.pf-photo-btns{display:flex;gap:.45rem;flex-wrap:wrap}
.file-btn{position:relative;cursor:pointer;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.switch{display:flex;align-items:center;gap:.5rem;font-size:.88rem;font-weight:600;margin-top:.2rem}
.switch input{width:1.1rem;height:1.1rem;accent-color:var(--accent)}

.tip{position:fixed;z-index:110;pointer-events:none;padding:.45rem .65rem;border-radius:.65rem;background:var(--pop);border:1px solid var(--line-2);box-shadow:0 .8rem 1.6rem -.6rem rgba(0,0,0,.7);font-size:.8rem;opacity:0;transform:translate(0,-50%) scale(.96);transition:opacity .12s,transform .12s;max-width:16rem}
.tip.on{opacity:1;transform:translate(0,-50%) scale(1)}
.tip.below{transform:translate(-50%,0) scale(.96)}
.tip.below.on{transform:translate(-50%,0) scale(1)}
.tip b{display:block}
.tip span{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(1.3rem + env(safe-area-inset-bottom,0px));z-index:120;transform:translate(-50%,20px);opacity:0;padding:.65rem 1rem;border-radius:.85rem;background:var(--pop);border:1px solid var(--line-2);font-size:.88rem;font-weight:600;box-shadow:0 1rem 2rem -.8rem rgba(0,0,0,.7);transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 2rem)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){.ph-stats{flex-basis:100%}}
@media (max-width:820px){
  .app{grid-template-columns:1fr;padding:.7rem;gap:.7rem}
  .sidebar{top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;padding:.5rem;border-radius:1.1rem;gap:.5rem}
  .side-sep{width:1px;height:2.4rem}
  .people{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:.25rem}
  .ph-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .jr{flex-wrap:wrap;position:relative;padding-right:4.4rem}
  .jr-main{flex-basis:calc(100% - 3rem)}
  .jr-side{width:100%;justify-content:space-between;padding-left:2.3rem}
  .jr-order{flex-direction:row;position:absolute;top:.5rem;right:.5rem}
  .grid2{grid-template-columns:1fr}
  .jm-wrap{padding:0}
  .jm{height:100dvh;border-radius:0}
  .jm-head{padding-top:calc(.9rem + env(safe-area-inset-top,0px))}
  .jm-titlerow{flex-wrap:wrap}
  .jm-title{font-size:1.15rem!important}
}
@media (prefers-reduced-motion:reduce){
  .blob,.badge{animation:none}
  *{transition:none!important;animation-duration:.01ms!important}
}

/* =====================================================
   v3: temas, navegação e páginas
   ===================================================== */
::placeholder{color:var(--dim);opacity:1}
*{scrollbar-color:var(--line-2) transparent}
body[data-view="login"] .shell{display:none}
body[data-view="app"] .login{display:none}
.link-btn{color:var(--accent-2);font-weight:700;font-size:.84rem}
.link-btn:hover{text-decoration:underline}
.shell{position:relative;z-index:1;min-height:100%;padding:0 1rem 1.4rem}
.nav{position:sticky;top:.7rem;z-index:30;display:flex;align-items:center;gap:.45rem;padding:.4rem .6rem .4rem .6rem;border-radius:1.1rem;margin:.7rem 0 1rem;min-height:3.5rem}
.logo-btn{display:inline-flex;align-items:center;padding:.2rem .55rem .2rem .35rem;border-radius:.8rem;margin-right:.5rem;color:var(--text)}
.logo-btn:hover{background:var(--f2)}
.nav-tabs{display:flex;gap:.2rem}
.nav-tab{display:inline-flex;align-items:center;gap:.4rem;height:2.3rem;padding:0 .85rem;border-radius:.7rem;font-weight:700;font-size:.92rem;color:var(--muted);transition:background .15s,color .15s}
.nav-tab svg{width:1.05rem;height:1.05rem}
.nav-tab:hover{background:var(--f3);color:var(--text)}
.nav-tab.on{background:var(--f4);color:var(--text);box-shadow:inset 0 1px 0 var(--hl)}
.srch-btn{display:inline-flex;align-items:center;gap:.5rem;height:2.3rem;min-width:15rem;padding:0 .6rem 0 .7rem;border-radius:.7rem;border:1px solid var(--line);background:var(--dk1);color:var(--dim);font-size:.9rem;transition:border-color .15s,background .15s}
.srch-btn:hover{border-color:var(--line-2);background:var(--f2)}
.srch-btn svg{width:1rem;height:1rem;flex:none}
.srch-btn span{flex:1;text-align:left;white-space:nowrap}
kbd{font:inherit;font-size:.7rem;font-weight:700;padding:.05rem .4rem;border-radius:.35rem;border:1px solid var(--line-2);color:var(--dim)}
.bell{position:relative}
.bell .badge{top:-5px;right:-5px}
.bell.ring{box-shadow:0 0 0 3px rgba(1,160,157,.28)}
.bell.ring svg{animation:ring 1.2s ease-in-out 2;transform-origin:50% 10%}
@keyframes ring{0%,100%{transform:rotate(0)}12%{transform:rotate(18deg)}28%{transform:rotate(-16deg)}44%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}76%{transform:rotate(4deg)}}
.me-btn{border-radius:50%;padding:2px;margin-left:.15rem;transition:transform .2s}
.me-btn:hover{transform:scale(1.06)}
.pauta-page{display:grid;grid-template-columns:5.4rem minmax(0,1fr);gap:1rem;align-items:start}
.pauta-main{display:flex;flex-direction:column;gap:1rem;min-width:0}
.sidebar{position:sticky;top:5.3rem;height:calc(100dvh - 6.3rem - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.chip.role-chip{background:var(--f3);border-color:var(--line-2);color:var(--t2)}
.spill{--c:var(--dim);display:inline-flex;align-items:center;gap:.35rem;font-size:.74rem;font-weight:700;color:var(--t2);white-space:nowrap}
.spill::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--c);flex:none}
.role-badge{--c:#748ffc;display:inline-flex;align-items:center;width:max-content;font-size:.72rem;font-weight:800;padding:.1rem .55rem;border-radius:1rem;color:color-mix(in srgb,var(--c) var(--tagpct),var(--tagbase));background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.role-badge.r-adm{--c:#01a09d}.role-badge.r-head{--c:#e6b800}.role-badge.r-atendimento{--c:#ff8a3d}.role-badge.r-criativo{--c:#748ffc}
.mlist{list-style:none;margin:.6rem 0 0;padding:0;display:flex;flex-direction:column;gap:.35rem}
.mrow{display:flex;align-items:center;gap:.7rem;padding:.5rem .7rem;cursor:pointer}
.mr-main{flex:1;min-width:0;display:flex;flex-direction:column}
.mr-sub{font-size:.76rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .stage{flex:none}
.mrow .spill{min-width:6.2rem}
.pj-empty{font-size:.84rem;color:var(--dim);padding:.5rem .2rem}

/* Dashboard */
.dash-head,.tm-head{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:1rem 1.2rem;margin-bottom:1rem}
.dash-head h1,.tm-head h1,.cl-head h1{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.dash-head p,.tm-head p{font-size:.86rem;max-width:34rem}
.dash-ctl,.tm-head-a{display:flex;align-items:center;gap:.5rem;margin-left:auto;flex-wrap:wrap}
.dash-lbl{display:inline-block;min-width:12rem;text-align:center;font-size:.92rem}
.dash-lbl::first-letter{text-transform:uppercase}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.7rem;margin-bottom:1rem}
.kpi{--c:var(--dim);text-align:left;padding:.9rem 1rem .8rem;border-radius:1rem;display:flex;flex-direction:column;gap:.1rem;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
.kpi b{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-weight:700;font-size:.92rem}
.kpi small{color:var(--muted);font-size:.76rem;line-height:1.3}
.kpi.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c),0 .8rem 1.6rem -1.1rem var(--c)}
.panel{padding:1rem 1.2rem 1.1rem}
.panel h2{font-size:1.02rem;font-weight:800;display:flex;align-items:center;gap:.5rem}
.panel h2>svg{width:1.1rem;height:1.1rem;color:var(--muted);flex:none}
.tm-tabs .tab svg{width:1rem;height:1rem}
.panel .blk-note{margin:.25rem 0 .4rem}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
.rate-list{list-style:none;margin:.4rem 0 0;padding:0}
.rate-row{display:flex;gap:.7rem;align-items:center;padding:.6rem .1rem;border-top:1px solid var(--line)}
.rr-main{flex:1;min-width:0}
.rr-top{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline}
.rr-pct{font-weight:800;font-variant-numeric:tabular-nums}
.rr-pct.hi{color:var(--green)}.rr-pct.mid{color:var(--acc-t)}.rr-pct.lo{color:var(--orange)}
.rate-row small{color:var(--muted);font-size:.76rem}
.bar{height:6px;background:var(--f3);border-radius:4px;margin:.3rem 0;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .3s}
.bar.hi i{background:var(--green)}.bar.lo i{background:var(--orange)}

/* Clientes */
.cl-layout{display:grid;grid-template-columns:19rem minmax(0,1fr);gap:1rem;align-items:start}
.cl-side{position:sticky;top:5.3rem;padding:1rem;display:flex;flex-direction:column;gap:.7rem;max-height:calc(100dvh - 6.3rem)}
.cl-side-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.cl-side-h h2{font-size:1.02rem;font-weight:800}
.cl-list{list-style:none;margin:0;padding:0;overflow-y:auto;display:flex;flex-direction:column;gap:.25rem}
.cl-item{width:100%;display:flex;align-items:center;gap:.65rem;padding:.5rem .55rem;border-radius:.75rem;text-align:left;transition:background .15s}
.cl-item:hover{background:var(--f3)}
.cl-item.on{background:rgba(1,160,157,.16);box-shadow:inset 0 0 0 1px rgba(1,160,157,.4)}
.cl-ini{width:2.2rem;height:2.2rem;border-radius:.65rem;display:grid;place-items:center;font-weight:800;font-size:.8rem;background:linear-gradient(135deg,rgba(1,160,157,.4),rgba(37,99,235,.32));color:var(--text);flex:none}
.cl-ini.big{width:3rem;height:3rem;font-size:1rem;border-radius:.85rem}
.cl-txt{display:flex;flex-direction:column;min-width:0}
.cl-txt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-txt small{color:var(--muted);font-size:.76rem}
.cl-main{display:flex;flex-direction:column;gap:1rem;min-width:0}
.cl-head{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:1rem 1.2rem}
.cl-head-t{display:flex;align-items:center;gap:.85rem;margin-right:auto;min-width:0}
.cl-head-a{display:flex;gap:.45rem;flex-wrap:wrap}
.grp{padding:.8rem 1rem 1rem}
.grp-h{display:flex;align-items:center;gap:.45rem;margin-bottom:.6rem}
.grp-t{display:inline-flex;align-items:center;gap:.5rem;font-weight:800;text-align:left;min-width:0}
.grp-t svg{width:1rem;height:1rem;color:var(--muted);flex:none}
.grp-t h2{font-size:1.05rem}.grp-t h3{font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pj-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:.7rem;align-items:start}
.cl-main,.grp,.pj{min-width:0}
.pj{padding:.7rem .8rem .8rem}
.pj-h{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.pj-n{font-size:.78rem}
.flash{animation:flash 1.8s ease}
@keyframes flash{0%,65%{box-shadow:0 0 0 2px var(--accent-2)}100%{box-shadow:0 0 0 2px transparent}}

/* Equipe */
.tm-tabs{border-bottom:1px solid var(--line);margin:0 0 1rem;padding:0 .3rem}
.tm-filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.9rem}
.tm-filters input{max-width:22rem}
.tm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(25rem,1fr));gap:.7rem}
.tm-card{display:flex;gap:.8rem;align-items:flex-start;padding:.85rem .9rem}
.tm-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:.3rem}
.tm-info>b{font-size:1rem}
.tm-info .contact{font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-act{display:flex;flex-direction:column;gap:.3rem}
.perm-wrap{overflow-x:auto}
.perm{width:100%;border-collapse:collapse;min-width:44rem}
.perm th{padding:.6rem .5rem;text-align:center;font-size:.8rem}
.perm th:first-child,.perm td:first-child{text-align:left}
.perm td{padding:.6rem .5rem;border-top:1px solid var(--line);text-align:center}
.perm td:first-child b{display:block;font-size:.92rem}
.perm td:first-child small{color:var(--muted);font-size:.78rem}
.tgl{position:relative;display:inline-block;width:2.4rem;height:1.35rem;vertical-align:middle}
.tgl input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;width:100%;height:100%}
.tgl span{position:absolute;inset:0;border-radius:1rem;background:var(--f4);border:1px solid var(--line-2);transition:background .2s}
.tgl span::after{content:"";position:absolute;left:.15rem;top:.14rem;width:.95rem;height:.95rem;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.tgl input:checked+span{background:var(--accent);border-color:var(--accent)}
.tgl input:checked+span::after{transform:translateX(1.05rem);background:#fff}
.tgl input:disabled{cursor:not-allowed}
.tgl input:disabled+span{opacity:.55}
.tgl input:focus-visible+span{outline:2px solid var(--accent-2);outline-offset:2px}
.role-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.7rem;margin-top:.7rem}
.role-card{padding:.8rem .9rem;display:flex;flex-direction:column;gap:.35rem}
.role-card p{font-size:.84rem;color:var(--muted)}

/* Login */
.login{position:fixed;inset:0;z-index:2;overflow-y:auto;display:grid;place-items:center;padding:1.5rem}
.login-card{width:min(62rem,100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);overflow:hidden}
.lc-form{padding:2.3rem 2.3rem 2rem;display:flex;flex-direction:column;gap:.9rem;position:relative;z-index:1}
.lc-form h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.lc-form .field{margin:0}
.lc-logo{color:var(--text);margin-bottom:.6rem}
.pw{position:relative}
.pw input{padding-right:5rem}
.pw .link-btn{position:absolute;right:.75rem;top:50%;transform:translateY(-50%)}
.lg-err{min-height:1.2rem;font-size:.86rem;color:var(--danger-t);font-weight:600}
.btn.lg{height:2.8rem;font-size:1rem;border-radius:.8rem}
.lc-demo{padding:2.2rem 1.8rem;background:var(--dk1);border-left:1px solid var(--line);position:relative;z-index:1}
.lc-demo h2{font-size:1.05rem;font-weight:800;margin-bottom:.3rem}
.lc-demo>p{font-size:.86rem;margin-bottom:1rem}
.demo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.demo-btn{display:flex;align-items:center;gap:.6rem;padding:.55rem .65rem;text-align:left;min-width:0}
.demo-btn>span:last-child{display:flex;flex-direction:column;min-width:0}
.demo-btn b{font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.demo-btn small{font-size:.74rem;color:var(--muted)}

/* Notificações */
.np{position:fixed;right:1rem;width:min(26.5rem,calc(100vw - 2rem));max-height:min(36rem,calc(100dvh - 6.5rem));z-index:70;display:flex;flex-direction:column;background:var(--pop);animation:ddin .16s ease}
.np>header{display:flex;align-items:center;gap:.5rem;padding:.8rem .9rem .6rem;position:relative;z-index:1}
.np>header h3{font-size:1rem;font-weight:800}
.np-list{overflow-y:auto;padding:.1rem .4rem .6rem}
.np-day{display:flex;width:max-content;margin:.5rem auto .3rem}
.np-item{width:100%;display:flex;align-items:flex-start;gap:.65rem;padding:.6rem .55rem;border-radius:.8rem;text-align:left;transition:background .15s}
.np-item:hover{background:var(--f3)}
.np-item.unread{background:rgba(1,160,157,.11)}
.np-txt{flex:1;min-width:0;font-size:.86rem;line-height:1.4}
.np-txt em{display:block;color:var(--muted);font-style:normal;font-size:.82rem}
.np-txt time{display:block;color:var(--dim);font-size:.74rem;margin-top:.1rem}
.np-dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--accent-2);flex:none;margin-top:.4rem}
.np-empty{padding:1.8rem 1rem;text-align:center;color:var(--muted);font-size:.9rem}

/* Busca */
.srch-wrap{position:fixed;inset:0;z-index:75;display:grid;justify-items:center;align-items:start;padding:11vh 1rem 1rem;background:var(--scrim);animation:fade .15s ease}
.srch{width:min(41rem,100%);max-height:min(34rem,78dvh);display:flex;flex-direction:column;background:var(--modal);animation:pop .2s cubic-bezier(.2,.8,.2,1)}
.srch-in{display:flex;align-items:center;gap:.7rem;padding:.85rem 1rem;border-bottom:1px solid var(--line);position:relative;z-index:1}
.srch-in>svg{width:1.2rem;height:1.2rem;color:var(--muted);flex:none}
.srch-in input{border:0!important;background:transparent!important;box-shadow:none!important;padding:.2rem 0!important;font-size:1.05rem!important}
.srch-list{overflow-y:auto;padding:.3rem .5rem .6rem}
.sr-item{width:100%;display:flex;align-items:center;gap:.7rem;padding:.5rem .6rem;border-radius:.7rem;text-align:left}
.sr-item.act,.sr-item:hover{background:var(--f3)}
.sr-ic{width:2rem;height:2rem;border-radius:.6rem;display:grid;place-items:center;background:var(--f3);flex:none;color:var(--muted)}
.sr-ic svg{width:1rem;height:1rem}
.sr-empty{padding:1.8rem 1rem;text-align:center;color:var(--muted);font-size:.9rem}
.jm-client .sep{font-style:normal;opacity:.55;margin:0 .1rem}

/* Ajustes do tema claro */
:root[data-theme="light"] .b1{background:radial-gradient(circle,#4fd6d2 0%,rgba(79,214,210,0) 70%)}
:root[data-theme="light"] .b2{background:radial-gradient(circle,#7aa2f7 0%,rgba(122,162,247,0) 70%)}
:root[data-theme="light"] .btn.ghost,:root[data-theme="light"] .icon-btn{box-shadow:none}
:root[data-theme="light"] .rt:hover{color:var(--text)}

@media (max-width:1240px){
  .nav-tab span,.srch-btn span,.srch-btn kbd,.nav .btn.sm span{display:none}
  .nav-tab{padding:0 .65rem}
  .srch-btn{min-width:0;width:2.3rem;padding:0;justify-content:center}
  .nav .btn.sm{padding:0 .6rem}
}
@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dash-grid{grid-template-columns:1fr}
  .cl-layout{grid-template-columns:minmax(0,1fr)}
  .cl-side{position:static;max-height:none}
  .pj-grid{grid-template-columns:1fr}
  .login-card{grid-template-columns:1fr}
  .lc-demo{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:820px){
  .shell{padding:0 .7rem 1rem}
  .pauta-page,.cl-layout{grid-template-columns:minmax(0,1fr)}
  .mrow{flex-wrap:wrap}
  .mr-main{flex:1 1 55%}
  .logo-btn{margin-right:0;padding:.15rem}
  .logo-btn svg{width:30px}
  .nav-tab{padding:0 .55rem}
  .nav-tabs{gap:0}
  .nav .grow{flex:1}
  .nav{flex-wrap:wrap;gap:.35rem}
  .sidebar{position:static;height:auto}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .demo-grid{grid-template-columns:1fr}
  .lc-form{padding:1.6rem 1.3rem}
  .lc-demo{padding:1.4rem 1.2rem}
  .dash-lbl{min-width:0}
}
</style>
</head>
<body data-view="login">

(function(){

const ALLOWED={B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,DEL:1,P:1,BR:1,UL:1,OL:1,LI:1,A:1,BLOCKQUOTE:1,H3:1,DIV:1,SPAN:1};
function sanitize(html){
  const t=document.createElement('template');t.innerHTML=String(html||'');
  const walk=n=>{[...n.childNodes].forEach(c=>{
    if(c.nodeType===1){
      if(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META','IMG','SVG'].includes(c.tagName)){c.remove();return}
      walk(c);
      if(!ALLOWED[c.tagName]){c.replaceWith(...c.childNodes);return}
      const isMention=c.tagName==='SPAN'&&c.classList.contains('mention')&&P(c.getAttribute('data-p'));
      [...c.attributes].forEach(a=>{
        const keep=(c.tagName==='A'&&a.name==='href'&&/^(https?:|mailto:)/i.test(a.value))||(isMention&&(a.name==='data-p'||a.name==='class'));
        if(!keep)c.removeAttribute(a.name)});
      if(c.tagName==='A'){c.setAttribute('target','_blank');c.setAttribute('rel','noopener')}
      if(c.tagName==='SPAN'&&!isMention){c.replaceWith(...c.childNodes)}
    }else if(c.nodeType!==3)c.remove();
  })};
  walk(t.content);return t.innerHTML.trim();
}

const tagsHtml=job=>job.tagIds.map(T).filter(Boolean).map(t=>`<span class="tag" style="--c:${t.color}">${esc(t.name)}</span>`).join('');
function flagsHtml(job,pid){let h='';
  if(job.approval)h+=job.approval.approverId===pid?'<span class="flag flag-appr">Aprovação interna</span>':`<span class="flag flag-wait">Aguardando ${esc(first(job.approval.approverId))}</span>`;
  if(job.approvedBadge)h+=`<span class="flag flag-ok">${ic('check')}Aprovado internamente</span>`;
  if(job.returnNote)h+='<span class="flag flag-back">Devolvido</span>';
  return h}
function timeHtml(job,pid){const a=job.assignees.find(x=>x.personId===pid);if(!a)return'';const run=!!a.runningSince,now=Date.now();
  const btn=canTimer(job,pid)?(run?`<button class="icon-btn pause" data-act="pause" data-id="${job.id}" data-p="${pid}" aria-label="Pausar cronômetro">${ic('pause')}</button>`
    :`<button class="icon-btn play" data-act="play" data-id="${job.id}" data-p="${pid}" aria-label="Dar play">${ic('play')}</button>`):'';
  return `<div class="jr-time">${btn}<div><span class="timer ${run?'live':''}" data-timer data-job="${job.id}" data-person="${pid}">${hms(jobPersonMs(job.id,pid,now))}</span><small>total <span data-timer data-job="${job.id}">${hms(jobTotalMs(job.id,now))}</span></small></div></div>`}
const parentLabel=job=>{const p=job.parentId&&J(job.parentId);return p?`<span class="parent-l" data-tip="Subtarefa de|#${p.code} ${esc(p.title)}">${ic('sub')}#${p.code}</span>`:''};
function jobRow(job,idx,pid,total,delivered){
  const reord=!delivered&&canReorder(pid);const cl=C(job.clientId);const col=COL(job.columnId);const apprHere=job.approval&&job.approval.approverId===pid;
  return `<li class="tile jr ${apprHere?'appr':''} ${delivered?'delivered':''}" tabindex="0" data-act="openJob" data-id="${job.id}" ${reord?'draggable="true" data-drag="row"':''}>
    ${reord?`<span class="grip" aria-hidden="true">${ic('grip')}</span>`:''}
    <span class="q-num" aria-label="${delivered?'Entregue':'Prioridade '+(idx+1)}">${delivered?ic('check'):idx+1}</span>
    <div class="jr-main"><div class="jr-id">
      <div class="jr-top"><span class="code">#${job.code}</span><span class="jr-title">${esc(job.title)}</span></div>
      <div class="jr-sub">${parentLabel(job)}<span class="client">${esc(cl?cl.name:'Sem cliente')}</span><span class="stage">${esc(col?col.name:'Sem etapa')}</span>${flagsHtml(job,pid)}${tagsHtml(job)}</div>
    </div></div>
    <div class="jr-side">${stack(job.assignees.map(a=>a.personId))}${timeHtml(job,pid)}</div>
    ${reord?`<div class="jr-order">
      <button class="icon-btn xs" data-act="qUp" data-id="${job.id}" data-p="${pid}" aria-label="Subir prioridade" ${idx===0?'disabled':''}>${ic('up')}</button>
      <button class="icon-btn xs" data-act="qDown" data-id="${job.id}" data-p="${pid}" aria-label="Descer prioridade" ${idx===total-1?'disabled':''}>${ic('down')}</button></div>`:''}
  </li>`}
function jobCard(job,idx,pid){const cl=C(job.clientId);const drag=canOperate(job)||canReorder(pid);const apprHere=job.approval&&job.approval.approverId===pid;const dv=deliveredBy(job,pid);
  return `<article class="tile kc ${apprHere?'appr':''} ${dv?'delivered':''}" tabindex="0" data-act="openJob" data-id="${job.id}" ${drag?'draggable="true" data-drag="card"':''}>
    <div class="jr-top"><span class="q-num">${dv?ic('check'):idx+1}</span><span class="code">#${job.code}</span>${parentLabel(job)}</div>
    ${flagsHtml(job,pid)?`<div class="jr-sub">${flagsHtml(job,pid)}</div>`:''}
    <div class="jr-title">${esc(job.title)}</div>
    <div class="jr-sub"><span class="client">${esc(cl?cl.name:'Sem cliente')}</span>${tagsHtml(job)}</div>
    <div class="kc-foot">${stack(job.assignees.map(a=>a.personId))}${timeHtml(job,pid)}</div>
  </article>`}
function renderPauta(){const pid=U.viewing;if(!P(pid))return;
  const all=queueOf(pid);const active=all.filter(j=>!deliveredBy(j,pid));const deliv=all.filter(j=>deliveredBy(j,pid));
  const adm=can('manage_columns');const pend=all.filter(j=>j.approval&&j.approval.approverId===pid);const view=U.view==='kanban'?'kanban':'list';
  let body='';
  if(view==='list'){
    body=active.length?`<ol class="jlist">${active.map((j,i)=>jobRow(j,i,pid,active.length,false)).join('')}</ol>`
      :`<div class="empty"><b>Nenhum job ativo na pauta de ${esc(first(pid))}</b>${can('create_jobs')?'Use “Nova tarefa” para criar um job ou aloque esta pessoa em um job existente.':'Quando alguém passar um job para esta pessoa, ele aparece aqui.'}</div>`;
    if(deliv.length)body+=`<details class="deliv" ${delivOpen?'open':''}><summary data-act="toggleDeliv">${ic('right')}Entregues por ${esc(first(pid))} (${deliv.length})</summary><ol class="jlist">${deliv.map((j,i)=>jobRow(j,i,pid,deliv.length,true)).join('')}</ol></details>`;
  }else{
    const order=[...active,...deliv];
    body=`<div class="kanban">${S.columns.map(c=>{const items=order.filter(j=>j.columnId===c.id);
      return `<section class="kcol" aria-label="${esc(c.name)}">
        <header class="kcol-head"><h3>${esc(c.name)}</h3><span class="count">${items.length}</span>
          ${adm?`<div class="kcol-tools"><button class="icon-btn xs" data-act="renameColumn" data-col="${c.id}" aria-label="Renomear coluna ${esc(c.name)}">${ic('edit')}</button>${c.base?'':`<button class="icon-btn xs" data-act="removeColumn" data-col="${c.id}" aria-label="Remover coluna ${esc(c.name)}">${ic('trash')}</button>`}</div>`:''}
        </header>
        <div class="kcol-body" data-drop="${c.id}">${items.map(j=>jobCard(j,active.indexOf(j),pid)).join('')||'<div class="k-empty">Arraste jobs para cá</div>'}</div>
      </section>`}).join('')}
      ${adm?`<button class="kcol-add" data-act="addColumn">${ic('plus')}Nova coluna</button>`:''}</div>`;
  }
  $('#pauta').innerHTML=`
    <div class="pauta-head">
      <div class="grow"><h2>Pauta de ${esc(first(pid))}</h2><p>${active.length} ${active.length===1?'job ativo':'jobs ativos'}, em ordem de prioridade${canReorder(pid)?'. Arraste ou use as setas para reordenar.':'.'}</p></div>
      <div class="seg" role="group" aria-label="Visualização">
        <button class="${view==='list'?'on':''}" data-act="setView" data-v="list" aria-pressed="${view==='list'}">${ic('list')}Lista</button>
        <button class="${view==='kanban'?'on':''}" data-act="setView" data-v="kanban" aria-pressed="${view==='kanban'}">${ic('kanban')}Kanban</button>
      </div>
      ${can('manage_tags')?`<button class="btn ghost sm" data-act="manageTags">${ic('tagI')}Tags</button>`:''}
    </div>
    ${pend.length?`<div class="alerts">${pend.map(j=>`<div class="alert"><span class="alert-ic" aria-hidden="true">!</span><div><b>Aprovação interna</b><span>#${j.code} ${esc(j.title)}, pedida por ${esc(nm(j.approval.requestedBy))}</span></div><button class="btn sm" data-act="openJob" data-id="${j.id}">Revisar</button></div>`).join('')}</div>`:''}
    ${body}`}

function rteBar(kind){const b=(cmd,label,title)=>`<button type="button" class="rt" data-cmd="${cmd}" title="${title}" aria-label="${title}" tabindex="-1">${label}</button>`;
  return `<div class="rte-bar" role="toolbar" aria-label="Formatação">${b('bold','<b>B</b>','Negrito')}${b('italic','<i style="font-family:Georgia,serif">I</i>','Itálico')}${b('underline','<u>U</u>','Sublinhado')}${b('strikeThrough','<s>S</s>','Tachado')}<span class="rt-sep"></span>${kind==='desc'?b('heading','<span style="font-weight:800">T</span>','Subtítulo'):''}${b('insertUnorderedList',ic('ul'),'Lista')}${b('insertOrderedList',ic('ol'),'Lista numerada')}${b('quote',ic('quote'),'Citação')}${b('link',ic('link'),'Link')}${kind==='chat'?b('mention','@','Mencionar alguém'):''}<span class="rt-sep"></span>${b('removeFormat',ic('clear'),'Limpar formatação')}</div>`}
function tabDesc(job,op){const n=job.links.length;
  return `<section class="blk">
    <div class="blk-head"><h4>Links essenciais</h4><span class="muted">${n?n+(n>1?' links':' link'):''}</span></div>

    ${op?`<div class="inline-form"><input type="text" id="lkLabel" placeholder="Rótulo, ex.: Pasta do Drive"><input type="url" id="lkUrl" placeholder="https://drive.google.com/..."><button class="btn sm" data-act="addLink">${ic('plus')}Adicionar link</button></div>`:''}
  </section>
  <section class="blk">

    <div class="rte">${op?rteBar('desc'):''}<div class="rte-area desc rich" contenteditable="${op?'true':'false'}" data-rte="desc" data-ph="Escreva o briefing, contexto e observações do job" aria-label="Descrição" role="textbox" aria-multiline="true">${sanitize(job.description)}</div></div>
  </section>`}
function tabSubs(job,op){const kids=childrenOf(job.id);const done=kids.filter(k=>k.columnId==='done').length;const now=Date.now();
  const defResp=isAssignee(job)?U.me:(job.assignees[0]?.personId||S.people[0].id);

    <div class="blk-head"><h4>Subtarefas</h4><span class="muted">${done} de ${kids.length} entregues</span><span class="progress"><i style="width:${kids.length?Math.round(done/kids.length*100):0}%"></i></span></div>

    ${kids.length?`<ul class="sj-list">${kids.map(k=>{const col=COL(k.columnId);return `<li class="tile sj" tabindex="0" data-act="openJob" data-id="${k.id}"><span class="code">#${k.code}</span><span class="jr-title">${esc(k.title)}</span>${flagsHtml(k,'')}<span class="stage">${esc(col?col.name:'')}</span>${stack(k.assignees.map(a=>a.personId))}<span class="timer" data-timer data-job="${k.id}">${hms(jobTotalMs(k.id,now))}</span>${ic('right')}</li>`}).join('')}</ul>`:'<p class="blk-note">Nenhuma subtarefa criada.</p>'}
    ${op?`<div class="sj-form"><input type="text" id="sjTitle" placeholder="Título da nova subtarefa">${picker({value:defResp,options:peopleItems(S.people),attrs:'id="sjResp" aria-label="Responsável pela subtarefa"',title:'Responsável'})}<button class="btn sm" data-act="addSubJob">${ic('plus')}Criar subtarefa</button></div>`:''}
  </section>`}
function tabPeople(job,op,adm){const now=Date.now();const others=S.people.filter(p=>!isAssignee(job,p.id));const flowDone=job.flowIndex>=job.flow.length;const cur=job.flow[job.flowIndex];
  const cards=job.assignees.map(a=>{const p=P(a.personId);if(!p)return'';const run=!!a.runningSince;const can=canTimer(job,p.id);
    const passOpts=[{value:'__only',label:'Só entregar',sub:'Encerra a sua parte sem passar adiante',lead:ic('check')},{header:'Entregar e passar para'},...peopleItems(S.people.filter(x=>x.id!==p.id),x=>job.flow.includes(x.id)?'Está no fluxo deste job':x.teams.join(', '))];
    return `<div class="tile pc ${run?'running':''} ${cur===p.id?'current':''}">
      ${adm?`<button class="icon-btn xs pc-x" data-act="removeAssignee" data-p="${p.id}" aria-label="Remover ${esc(p.name)} do job">${ic('x')}</button>`:''}
      <div class="pc-top">${avatar(p,38,true)}<div><b>${esc(p.name)}</b><small>${esc(p.teams[0]||'Sem equipe')}</small></div></div>
      <div class="pc-state ${a.delivered?'ok':run?'run':''}">${a.delivered?'Entregou a sua parte':run?'Cronômetro em play':'Cronômetro pausado'}${a.addedForApproval?', aprovador':''}${cur===p.id?', vez desta pessoa':''}</div>
      <span class="timer ${run?'live':''}" data-timer data-job="${job.id}" data-person="${p.id}">${hms(jobPersonMs(job.id,p.id,now))}</span>
      <div class="pc-btns">
        ${run?`<button class="icon-btn pause" data-act="pause" data-id="${job.id}" data-p="${p.id}" aria-label="Pausar ${esc(p.name)}">${ic('pause')}</button>`
             :`<button class="icon-btn play" data-act="play" data-id="${job.id}" data-p="${p.id}" aria-label="Dar play para ${esc(p.name)}" ${can?'':'disabled'}>${ic('play')}</button>`}
        ${picker({options:passOpts,cls:'sm',title:'Entregar tarefa',fixed:`${ic('check')}<span class="pk-l">${a.delivered?'Entregue':'Entregar tarefa'}</span>${ic('chev')}`,disabled:!can||a.delivered,attrs:`data-change="deliverPass" data-id="${job.id}" data-p="${p.id}"`})}
      </div>
    </div>`}).join('');
  const addCard=adm&&others.length?`<div class="pc-add">${ic('users')}<span>Alocar mais alguém neste job</span>${picker({options:peopleItems(others),cls:'sm accent',fixed:`${ic('plus')}<span class="pk-l">Alocar pessoa</span>`,title:'Alocar pessoa',attrs:'data-change="addAssignee" aria-label="Alocar pessoa"'})}</div>`:'';

      </li>`}).join('')}</ol>`:'<p class="blk-note">Nenhuma etapa definida.</p>'}
    <div class="flow-tools">
      ${op?`<button class="btn sm ghost" data-act="flowPrev" ${job.flowIndex>0?'':'disabled'}>${ic('left')}Voltar etapa</button><button class="btn sm ghost" data-act="flowNext" ${!flowDone&&job.flow.length?'':'disabled'}>Avançar etapa${ic('right')}</button>`:''}

    </div>
  </section>`}
function tabFeed(job){const acting=U.me;let lastDay='';
  const items=job.feed.map(f=>{const d=dayLabel(f.at);let sep='';if(d!==lastDay){lastDay=d;sep=`<div class="fe-day">${esc(d)}</div>`}
    const p=P(f.actorId)||ghost;
    if(f.type==='comment'){const mine=f.actorId===acting;const ment=!mine&&String(f.html).includes(`data-p="${acting}"`);
      return sep+`<div class="fe-c ${mine?'mine':''} ${ment?'ment':''}">${avatar(p,30)}<div class="bubble"><div class="bh"><b>${esc(p.name)}</b>${ment?'<span class="flag flag-wait">Mencionou você</span>':''}<time>${fmtTime(f.at)}</time></div><div class="bb rich">${sanitize(f.html)}</div></div></div>`}
    return sep+`<div class="fe-ev">${avatar(p,18)}<span class="txt"><b>${esc(first(f.actorId))}</b> ${esc(f.text)}</span><time>${fmtTime(f.at)}</time></div>`}).join('');

}

function periodRange(p,off){
  const d=new Date();d.setHours(0,0,0,0);let s,e;
  if(p==='day'){d.setDate(d.getDate()+off);s=d.getTime();e=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime()}
  else if(p==='month'){const m=new Date(d.getFullYear(),d.getMonth()+off,1);s=m.getTime();e=new Date(m.getFullYear(),m.getMonth()+1,1).getTime()}
  else{const y=d.getFullYear()+off;s=new Date(y,0,1).getTime();e=new Date(y+1,0,1).getTime()}
  return{s,e};
}
function periodLabel(p,off){
  const dt=new Date(periodRange(p,off).s);
  if(p==='day'){const t=dt.toLocaleDateString('pt-BR',{day:'numeric',month:'long'});if(off===0)return'Hoje, '+t;if(off===-1)return'Ontem, '+t;return dt.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
  if(p==='month')return dt.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  return String(dt.getFullYear());
}
function jobInRange(j,r){
  const now=Date.now();
  if(j.createdAt>=r.s&&j.createdAt<r.e)return true;
  if(j.deliveredAt&&j.deliveredAt>=r.s&&j.deliveredAt<r.e)return true;
  if(j.feed.some(f=>f.at>=r.s&&f.at<r.e))return true;
  if(S.logs.some(l=>l.jobId===j.id&&l.delta==null&&l.start<r.e&&l.end>=r.s))return true;
  return j.assignees.some(a=>a.runningSince&&a.runningSince<r.e&&now>=r.s);

const NT={newjob:'criou um job novo na sua pauta:',assign:'alocou você no job',mention:'mencionou você em um comentário de',transfer:'transferiu o job para você:',pass:'entregou a parte dele e passou o job para você:',approval:'pediu a sua aprovação interna em',approved:'aprovou internamente e encaminhou para você:',returned:'devolveu o job para você:',flow:'avançou o fluxo e agora o job é seu:'};
function notify(toId,type,job,extra){
  if(!toId||toId===U.me||!P(toId))return;
  S.notifs.push({id:uid('n'),toId,at:Date.now(),type,actorId:U.me,jobId:job?job.id:null,extra:extra||'',read:false});
  const mine=S.notifs.filter(n=>n.toId===toId);
  if(mine.length>80){const drop=new Set(mine.slice(0,mine.length-80).map(n=>n.id));S.notifs=S.notifs.filter(n=>!drop.has(n.id))}
}
let actx=null;
function ding(){
  try{
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t=actx.currentTime;
    [[880,0],[1318.5,.14]].forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.6);
      o.connect(g);g.connect(actx.destination);o.start(t+d);o.stop(t+d+.65)});
  }catch(e){}
}
function bellAlert(fresh){
  ringUntil=Date.now()+2600;
  const m=me();if(m&&!m.soundOff)ding();
  if(fresh&&fresh[0]){const n=fresh[0],j=J(n.jobId);toast(`${nm(n.actorId)} ${NT[n.type]||''} ${j?'#'+j.code:''}`.trim())}

}

  jobs.sort((a,b)=>(String(b.code).startsWith(q)-String(a.code).startsWith(q))||(norm(b.title).startsWith(q)-norm(a.title).startsWith(q))||b.code-a.code);
  jobs.slice(0,8).forEach(j=>{const cl=C(j.clientId),loc=locOf(j);out.push({section:'Jobs',type:'job',id:j.id,title:`#${j.code} ${j.title}`,sub:`${cl?cl.name:'Sem cliente'}${loc.project?' › '+loc.project.name:''}`,tag:COL(j.columnId)?.name,lead:`<span class="sr-ic">${ic('list')}</span>`})});

function deleteUser(pid){
  const p=P(pid);if(!p||!can('manage_team'))return;
  if(pid===U.me)return toast('Você não pode excluir a própria conta enquanto está logado.');
  if(p.role==='adm'&&S.people.filter(x=>x.role==='adm').length===1)return toast('Mantenha pelo menos um administrador.');
  const n=personJobs(pid).length;
  dialog({title:'Excluir usuário',danger:true,confirm:'Excluir usuário',body:`<p>Excluir <b>${esc(p.name)}</b>?${n?` A pessoa sai de ${n} ${n===1?'job':'jobs'} e dos fluxos de responsáveis.`:''} Esta ação não pode ser desfeita.</p>`,
    onConfirm:()=>{
      S.jobs.forEach(j=>{
        if(j.assignees.some(a=>a.personId===pid)){stopTimer(j,pid);j.assignees=j.assignees.filter(a=>a.personId!==pid)}
        const fi=j.flow.indexOf(pid);if(fi>=0){j.flow.splice(fi,1);if(fi<j.flowIndex)j.flowIndex--}
        j.flowIndex=Math.max(0,Math.min(j.flowIndex,j.flow.length));
        if(j.approval&&j.approval.approverId===pid)j.approval=null;
      });
      S.people=S.people.filter(x=>x.id!==pid);delete S.queue[pid];S.notifs=S.notifs.filter(n=>n.toId!==pid);
      if(U.viewing===pid)U.viewing=U.me;
      commit();toast(`${p.name} foi removido da equipe.`);
    }});
}
function readLogo(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const h=96,w=Math.min(480,Math.round(img.width/img.height*h));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/png'))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)});
}
