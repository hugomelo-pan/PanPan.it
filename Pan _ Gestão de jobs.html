  delGroup(el){if(!needClients())return;const g=findGroup(el.dataset.cid,el.dataset.gid),n=jobsIn(el.dataset.cid,g.projects.map(p=>p.id));
    if(n)return toast(`O grupo ${g.name} tem ${n} ${n===1?'job':'jobs'}. Exclua os jobs antes de remover o grupo.`);
    dialog({title:'Excluir grupo',danger:true,confirm:'Excluir grupo',body:`<p>Excluir o grupo <b>${esc(g.name)}</b> e seus projetos? Esta ação não pode ser desfeita.</p>`,onConfirm:()=>{const c=C(el.dataset.cid);c.groups=c.groups.filter(x=>x.id!==g.id);commit()}})},
  addProject(el){if(!needClients())return;promptName('Novo projeto','Nome do projeto','',v=>{findGroup(el.dataset.cid,el.dataset.gid).projects.push({id:uid('pr'),name:v});commit()},'Criar projeto')},
  renProject(el){if(!needClients())return;const p=findProject(el.dataset.cid,el.dataset.gid,el.dataset.pid);promptName('Renomear projeto','Nome do projeto',p.name,v=>{p.name=v;commit()})},
  delProject(el){if(!needClients())return;const p=findProject(el.dataset.cid,el.dataset.gid,el.dataset.pid),n=jobsIn(el.dataset.cid,[p.id]);
    if(n)return toast(`O projeto ${p.name} tem ${n} ${n===1?'job':'jobs'}. Exclua os jobs antes de remover o projeto.`);
    dialog({title:'Excluir projeto',danger:true,confirm:'Excluir projeto',body:`<p>Excluir o projeto <b>${esc(p.name)}</b>? Esta ação não pode ser desfeita.</p>`,onConfirm:()=>{const g=findGroup(el.dataset.cid,el.dataset.gid);g.projects=g.projects.filter(x=>x.id!==p.id);commit()}})},
  newJobIn(el){openNewJob({clientId:el.dataset.cid,projectId:el.dataset.pid})},
  teamTab(el){U.teamTab=el.dataset.t;commit()},
  goPerson(el){U.page='pauta';U.viewing=el.dataset.id;commit();window.scrollTo(0,0)},
  newUser(){openUserForm()},
  editUser(el){openUserForm(el.dataset.id)},
  delUser(el){deleteUser(el.dataset.id)},
  rmLogo(){S.brand.logo=null;commit();toast('Logo padrão restaurada.')}
});
Object.assign(CH,{
  tmRole(el){U.tmRole=el.value;commit()},
  tmTeam(el){U.tmTeam=el.value;commit()},
  permToggle(el){
    if(!can('manage_roles'))return deny('Você não tem permissão para editar os cargos.');
    const r=el.dataset.role,k=el.dataset.perm;if(r==='adm')return;
    S.roles[r][k]=el.checked;
    if(!S.roles.head||!S.roles.atendimento){S.roles=Object.assign(defaultRoles(),S.roles)}
    commit();
  },
  async logoUp(el){const f=el.files[0];if(!f)return;try{S.brand.logo=await readLogo(f);commit();toast('Logo atualizada.')}catch(e){toast('Não foi possível ler esta imagem.')}}
});

/* =========================================================
   Eventos das novas telas e sincronização entre abas
   ========================================================= */
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset&&t.dataset.input;if(!k)return;
  if(k==='clQ'){U.clQ=t.value;saveU();const l=$('#clList');if(l)l.innerHTML=clListHtml()}
  else if(k==='tmQ'){U.tmQ=t.value;saveU();const g=$('#tmGrid');if(g)g.innerHTML=teamGridHtml()}
  else if(k==='srQ')drawSearch(t.value);
});
document.addEventListener('click',e=>{
  if(notifOpen&&!e.target.closest('#np')&&!e.target.closest('.bell')&&!e.target.closest('.dd'))toggleNotif(false);
});
document.addEventListener('keydown',e=>{
  if(!me()){if(e.key==='Enter'&&(e.target.id==='lgEmail'||e.target.id==='lgPass')){e.preventDefault();tryLogin()}return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();SR?closeSearch():openSearch();return}
  if(SR){
    const n=SR.items.length;
    if(e.key==='ArrowDown'&&n){e.preventDefault();SR.idx=(SR.idx+1)%n;markSearch()}
    else if(e.key==='ArrowUp'&&n){e.preventDefault();SR.idx=(SR.idx-1+n)%n;markSearch()}
    else if(e.key==='Enter'&&n){e.preventDefault();pickSearch(SR.idx)}
    return;
  }
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/^(INPUT|TEXTAREA)$/.test(e.target.tagName)&&!e.target.isContentEditable&&!document.querySelector('.dlg-wrap')){e.preventDefault();openSearch()}
});
window.addEventListener('storage',e=>{
  if(e.key!==KEY||!e.newValue)return;
  let d;try{d=JSON.parse(e.newValue)}catch(err){return}
  if(!d||d.v!==3)return;
  const before=new Set(S.notifs.filter(n=>n.toId===U.me).map(n=>n.id));
  S=d;
  if(!U.me){renderLogin();return}
  if(!me()){doLogout(true);return}
  const fresh=S.notifs.filter(n=>n.toId===U.me&&!n.read&&!before.has(n.id));
  const a=document.activeElement;
  const busy=(a&&(a.isContentEditable||/^(INPUT|TEXTAREA)$/.test(a.tagName)))||document.querySelector('.dlg-wrap,.srch-wrap')||DD;
  if(fresh.length)bellAlert(fresh);
  if(busy){renderNav();renderNotifPanel()}else renderAll();
});

/* =========================================================
   Eventos globais
   ========================================================= */
document.addEventListener('click',e=>{
  if(e.target.closest('.dd'))return;
  const pk=e.target.closest('[data-pk]');
  if(pk){if(pk.disabled)return;if(DD&&DD.anchorEl===pk){closeDD();return}tipEl.classList.remove('on');openPicker(pk);return}
  if(DD&&!(DD.anchorEl&&DD.anchorEl.contains(e.target))&&!e.target.closest('[data-rte]'))closeDD();
  if(e.target.closest('.dlg-wrap'))return;
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const fn=A[el.dataset.act];if(fn){if(el.tagName==='A')e.preventDefault();fn(el,e)}
});
document.addEventListener('change',e=>{if(e.target.closest('.dlg-wrap'))return;const el=e.target.closest('[data-change]');if(!el)return;const fn=CH[el.dataset.change];fn&&fn(el,e)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(SR){closeSearch();return}if(notifOpen){toggleNotif(false);return}const dl=document.querySelectorAll('.dlg-wrap');if(dl.length){dl[dl.length-1].remove();return}if(openJobId)closeModal();return}
  if(e.key!=='Enter'||e.target.closest('.dlg-wrap'))return;
  if(!e.shiftKey&&e.target.closest('[data-rte="chat"]')){e.preventDefault();A.sendComment();return}
  if(e.target.id==='lkUrl'||e.target.id==='lkLabel'){e.preventDefault();A.addLink();return}
  if(e.target.id==='sjTitle'){e.preventDefault();A.addSubJob();return}
  if(e.target.matches('.jm-title')){e.target.blur();return}
  if(e.target.matches('.jr[data-act],.kc[data-act],.sj[data-act],.mrow[data-act]')){e.preventDefault();A.openJob(e.target)}
});

/* Arrastar e soltar: pauta (lista) e kanban */
let drag=null;
const clearDnD=()=>document.querySelectorAll('.dragging,.drop-before,.drop-after,.drop-on').forEach(x=>x.classList.remove('dragging','drop-before','drop-after','drop-on'));
document.addEventListener('dragstart',e=>{const el=e.target.closest&&e.target.closest('[data-drag]');if(!el)return;drag={type:el.dataset.drag,id:el.dataset.id};el.classList.add('dragging');tipEl.classList.remove('on');closeDD();
  e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',el.dataset.id)}catch(err){}});
document.addEventListener('dragend',()=>{clearDnD();drag=null});
document.addEventListener('dragover',e=>{if(!drag)return;const t=e.target.closest(`[data-drag="${drag.type}"]`);
  document.querySelectorAll('.drop-before,.drop-after').forEach(x=>{if(x!==t)x.classList.remove('drop-before','drop-after')});
  if(drag.type==='card'){const zone=e.target.closest('[data-drop]');document.querySelectorAll('.drop-on').forEach(z=>{if(z!==zone)z.classList.remove('drop-on')});if(zone){e.preventDefault();zone.classList.add('drop-on')}}
  if(t&&t.dataset.id!==drag.id){e.preventDefault();const r=t.getBoundingClientRect();const after=e.clientY>r.top+r.height/2;t.classList.toggle('drop-after',after);t.classList.toggle('drop-before',!after)}});
document.addEventListener('drop',e=>{if(!drag)return;e.preventDefault();
  const t=e.target.closest(`[data-drag="${drag.type}"]`);const after=!!(t&&t.classList.contains('drop-after'));const pid=U.viewing;let changed=false;const job=J(drag.id);
  if(drag.type==='card'){const zone=e.target.closest('[data-drop]');if(zone&&job&&zone.dataset.drop!==job.columnId&&moveJobToColumn(job,zone.dataset.drop))changed=true}
  if(t&&t.dataset.id!==drag.id){
    if(canReorder(pid)){const all=queueOf(pid);const act=all.filter(j=>!deliveredBy(j,pid)).map(j=>j.id).filter(x=>x!==drag.id);const del=all.filter(j=>deliveredBy(j,pid)).map(j=>j.id).filter(x=>x!==drag.id);
      let i=act.indexOf(t.dataset.id);if(i>=0){if(after)i++;act.splice(i,0,drag.id);S.queue[pid]=[...act,...del];changed=true}}
    else if(drag.type==='row')deny('Só administradores reorganizam a pauta de outras pessoas.')}
  clearDnD();drag=null;if(changed)commit()});

/* =========================================================
   Inicialização
   ========================================================= */
applyTheme((me()&&me().theme)||store.get('pan-theme')||'dark');
if(U.me&&P(U.me)){if(!U.viewing||!P(U.viewing))U.viewing=U.me;showApp();renderAll()}
else{U.me=null;showLogin();renderLogin()}
})();
</script>
